name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git history engines need real commits

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov-report=xml

      - name: Rule accuracy benchmark
        run: pytest tests/benchmarks -o addopts="" -q

  lint:
    name: Lint (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      # The existing codebase has a large lint backlog. A changed file may not gain ruff
      # violations, and a new file must be clean, so the backlog only ever shrinks.
      - name: Ruff (no new violations)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-parse HEAD~1)
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.py' | grep -v '^tests/fixtures/' || true)
          fail=0
          for f in $files; do
            new=$(ruff check --output-format concise "$f" 2>/dev/null | grep -c "^$f:" || true)
            old=0
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              old=$(git show "$BASE_SHA:$f" | ruff check --output-format concise --stdin-filename "$f" - 2>/dev/null | grep -c "^$f:" || true)
            fi
            if [ "$new" -gt "$old" ]; then
              echo "::error file=$f::ruff violations increased from $old to $new"
              ruff check --output-format concise "$f" || true
              fail=1
            fi
          done
          exit $fail

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
