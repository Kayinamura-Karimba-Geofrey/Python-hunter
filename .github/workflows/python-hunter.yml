name: Python Hunter Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]
  schedule:
    - cron: '0 3 * * 1'  # Run weekly at 03:00 UTC on Mondays
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Python Hunter SAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Hunter
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Execute Python Hunter Security Analysis
        run: |
          python-hunter scan . \
            --ci \
            --format sarif \
            --output python-hunter.sarif \
            --fail-on high

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: python-hunter.sarif

      - name: Upload Scan Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-hunter-security-report
          path: python-hunter.sarif
          retention-days: 14
