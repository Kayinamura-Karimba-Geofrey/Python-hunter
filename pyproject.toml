[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-hunter"
dynamic = ["version"]
description = "Enterprise Python Security & Code Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Python Hunter Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.28.0",
]
dev = [
    "python-hunter[api]",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.9.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.99.0",
    "pre-commit>=3.6.2",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
python-hunter = "python_hunter.interfaces.cli.main:cli"

[tool.hatch.version]
path = "src/python_hunter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/python_hunter"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Intentionally vulnerable and malformed sample code used as scanner input.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "ASYNC", # flake8-async
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # long help/message strings; code width is left to the formatter
    "RUF001", # ✓/• glyphs in CLI output are intentional
    "RUF012", # mutable class-level rule tables are read-only by convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
# Typed modules held to strict mode. Add modules here as they are cleaned up; imports
# of not-yet-typed modules are followed silently so their errors are not reported.
files = [
    "src/python_hunter/application/api/security.py",
    "src/python_hunter/application/api/scan_jobs.py",
    "src/python_hunter/application/services/scan_queries.py",
    "src/python_hunter/infrastructure/storage/scan_store.py",
    "src/python_hunter/infrastructure/config/settings.py",
]
follow_imports = "silent"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --cov=python_hunter --cov-report=term-missing"
asyncio_mode = "auto"
